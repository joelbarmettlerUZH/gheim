name: test

# PR gate only. Pushes to main go through release.yml, which runs the
# same test suite as a publish gate — running both on push duplicates
# work and produces misleading red Xs on commits whose publish actually
# went green.
on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Ruff (SDK + server)
        # training/ is research code with dev-only data. Like its tests, it
        # stays out of the PR gate. Keep the ruff pin in sync with the Makefile.
        run: uvx ruff@0.17.5 check packages/gheim-py server

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Set Python version
        run: uv python install ${{ matrix.python-version }}
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Run tests (SDK + server)
        # Skip training/tests; they need the Geonames CH dump and other
        # external data files that are dev-only.
        run: uv run pytest packages/gheim-py/tests server/tests

  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/gheim-js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run lint
      - name: Test
        run: bun test
      - name: Build
        run: bun run build
