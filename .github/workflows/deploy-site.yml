name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "packages/gheim-js/**"
      - "paper/paper.pdf"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

# Single concurrent deploy; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          # Auto-enable Pages on first run instead of requiring a manual
          # one-click toggle in the repo settings UI.
          enablement: true

      # Install from the workspace root so the site's `gheim:
      # workspace:*` dep links to the local `packages/gheim-js`.
      # Avoids the chicken-and-egg of requiring a published gheim
      # version on npm before the site can deploy.
      - run: bun install --frozen-lockfile

      # The site imports `gheim` via `workspace:*`. bun symlinks the
      # package source into `node_modules/gheim`, but `package.json`'s
      # `exports` map points at `dist/` — which doesn't exist on a fresh
      # checkout. Build the SDK first so the site's astro check + build see
      # real files.
      - name: Build SDK (so site can resolve `gheim`)
        run: bun run build
        working-directory: packages/gheim-js

      - run: bun run build
        working-directory: site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
